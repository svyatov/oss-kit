version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The docs site has its own dependency tree, so the root entry above does not reach it. Bun
  # gets version updates only, never security updates, so a CVE in Astro arrives through this
  # weekly bump or not at all.
  - package-ecosystem: "bun"
    directory: "/site"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns: ["*"]
        update-types: ["minor", "patch"]
