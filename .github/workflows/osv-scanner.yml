name: osv-scanner

on:
  pull_request:
  schedule:
    - cron: "30 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Scoped to what the change introduces, so it can block the merge. A scan of
  # the whole repository would fail on an advisory published outside the change,
  # which no contributor can resolve.
  #
  # upload-sarif is off because a pull request from a fork gets a read-only
  # token whatever this block grants, and the upstream upload step carries no
  # fork guard and no continue-on-error, so uploading would fail the job for
  # every outside contributor. The job's value is the pass or fail; the
  # scheduled run below is what populates code scanning.
  #
  # security-events: write stays even so. The called workflow requests it for
  # its scan job, and granting less fails with "The workflow is requesting
  # 'security-events: write', but is only allowed 'security-events: none'." An
  # input that disables the step needing it does not change that. Before v2.5.0
  # the request sat at the called workflow's top level and the run died before
  # any job started; v2.5.0 moved it to the job, which is where zizmor wants a
  # permission scoped. The grant this block has to make is the same either way.
  pull-request:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67  # v2.5.1
    with:
      upload-sarif: false

  # Reports the whole repository and never gates a merge. Also runs on
  # workflow_dispatch, so a fix landed on the default branch can be confirmed
  # and its code scanning alerts closed without waiting for the weekly cron.
  full-scan:
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67  # v2.5.1
