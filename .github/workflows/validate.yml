name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spec:
    name: skills-ref validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
      - run: pip install "skills-ref @ git+https://github.com/agentskills/agentskills.git@492e1b71046249d085444cad81d47985836c451b#subdirectory=skills-ref"
      - name: Validate every skill
        run: |
          set -u
          shopt -s nullglob
          dirs=(skills/*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "no skill directories under skills/; nothing to validate" >&2
            exit 1
          fi
          status=0
          for dir in "${dirs[@]}"; do
            echo "== $dir"
            skills-ref validate "$dir" || status=1
          done
          exit $status

  drift:
    name: STANDARD.md drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: ./tests/test-check-drift.sh
      - run: ./scripts/check-drift.sh

  scan:
    name: skillspector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - run: uv tool install git+https://github.com/NVIDIA/skillspector.git@a54947c307fe19a24a43db55f6148e181a987a67
      - run: skillspector scan ./skills/ --no-llm --format json
