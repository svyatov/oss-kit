name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spec:
    name: agentskills validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
      - run: pip install skills-ref
      - name: Validate every skill
        run: |
          set -u
          shopt -s nullglob
          dirs=(skills/*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "no skill directories under skills/; nothing to validate" >&2
            exit 1
          fi
          status=0
          for dir in "${dirs[@]}"; do
            echo "== $dir"
            agentskills validate "$dir" || status=1
          done
          exit $status

  drift:
    name: STANDARD.md drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: ./tests/test-check-drift.sh
      - run: ./scripts/check-drift.sh

  scan:
    name: skillspector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      - run: uv tool install git+https://github.com/NVIDIA/skillspector.git
      - run: skillspector scan ./skills/ --no-llm --format json
